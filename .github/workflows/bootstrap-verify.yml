name: Verify

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout exact production source
        uses: actions/checkout@v6
        with:
          ref: 641671a096fa9b7944276c6512caf203e36297f6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22.16.0
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Generate farm map
        run: npm run generate:maps

      - name: Verify generated map is committed
        run: git diff --exit-code -- public/maps/farm-test.json

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Verify source
        run: npm run check

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Run browser smoke
        run: npm run test:e2e

      - name: Upload production bundle
        uses: actions/upload-artifact@v4
        with:
          name: vercel-dist-main-641671a
          path: dist/
          if-no-files-found: error
          retention-days: 7

      - name: Upload browser evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: farm-boot-smoke
          path: test-results/
          if-no-files-found: warn
          retention-days: 7
