name: Publish Vercel Runtime

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  publish-runtime:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout exact production source
        uses: actions/checkout@v6
        with:
          ref: 641671a096fa9b7944276c6512caf203e36297f6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22.16.0
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Build exact production bundle from a clean output directory
        shell: bash
        run: |
          set -euo pipefail
          rm -rf dist
          npm run build
          npm run verify:production-bundle
        env:
          HH_FARM_GIT_SHA: 641671a096fa9b7944276c6512caf203e36297f6
          HH_FARM_GIT_REF: main
          HH_FARM_DEPLOYMENT_ENVIRONMENT: production
          HH_FARM_DEPLOYMENT_URL: https://hh-farm.vercel.app

      - name: Verify every HTML entry reference exists
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE'
          const fs = require('node:fs');
          const path = require('node:path');

          const html = fs.readFileSync('dist/index.html', 'utf8');
          const references = [...html.matchAll(/(?:src|href)="\/([^"]+)"/g)].map((match) => match[1]);

          if (references.length === 0) {
            throw new Error('dist/index.html contains no root-relative runtime references.');
          }

          for (const reference of references) {
            const target = path.join('dist', reference);
            if (!fs.existsSync(target) || !fs.statSync(target).isFile()) {
              throw new Error(`Missing runtime reference: ${reference}`);
            }
          }

          console.log(`Verified ${references.length} HTML runtime references: ${references.join(', ')}`);
          NODE

      - name: Package immutable runtime
        shell: bash
        run: |
          set -euo pipefail
          archive="$RUNNER_TEMP/hh-farm-runtime.tar.gz"
          tar --format=ustar --exclude='*.map' -C dist -czf "$archive" .
          sha256sum "$archive" | tee "$RUNNER_TEMP/hh-farm-runtime.tar.gz.sha256"
          cat > "$RUNNER_TEMP/runtime-manifest.json" <<'JSON'
          {
            "sourceBranch": "main",
            "sourceSha": "641671a096fa9b7944276c6512caf203e36297f6",
            "deploymentUrl": "https://hh-farm.vercel.app",
            "artifact": "hh-farm-runtime.tar.gz"
          }
          JSON

      - name: Publish delivery branch
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git switch --orphan vercel-runtime-artifact
          git rm -rf --ignore-unmatch .
          git clean -fdx
          cp "$RUNNER_TEMP/hh-farm-runtime.tar.gz" .
          cp "$RUNNER_TEMP/hh-farm-runtime.tar.gz.sha256" .
          cp "$RUNNER_TEMP/runtime-manifest.json" .
          git add hh-farm-runtime.tar.gz hh-farm-runtime.tar.gz.sha256 runtime-manifest.json
          git commit -m "deploy: publish HH Farm runtime 641671a"
          git push --force origin HEAD:refs/heads/deploy/vercel-runtime

      - name: Upload delivery evidence
        uses: actions/upload-artifact@v4
        with:
          name: vercel-runtime-main-641671a
          path: |
            ${{ runner.temp }}/hh-farm-runtime.tar.gz
            ${{ runner.temp }}/hh-farm-runtime.tar.gz.sha256
            ${{ runner.temp }}/runtime-manifest.json
          if-no-files-found: error
          retention-days: 7
