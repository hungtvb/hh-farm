name: ChatGPT Apply TON-233 Lint Fix

on:
  pull_request:
    branches:
      - main
    paths:
      - .github/workflows/chatgpt-source-export.yml
      - .chatgpt/ton233-fix2.patch.gz

permissions:
  contents: write

jobs:
  apply-fix:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout automation branch
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          persist-credentials: true

      - name: Preserve and verify patch
        shell: bash
        run: |
          set -euo pipefail
          cp .chatgpt/ton233-fix2.patch.gz "$RUNNER_TEMP/ton233-fix2.patch.gz"
          echo "5c37eb019d9358d38fcc009bca5f25e4c4ad5726938519e8f09d4ec1abe09734  $RUNNER_TEMP/ton233-fix2.patch.gz" | sha256sum --check

      - name: Apply fix to exact feature commit
        shell: bash
        run: |
          set -euo pipefail
          git checkout --detach 5263b4eb41f066aef74a258ee63ff0ecbec490b4
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          gzip -dc "$RUNNER_TEMP/ton233-fix2.patch.gz" | git am
          test "$(git rev-parse HEAD^{tree})" = "9e1d60370bdea9634b1a02e4b170e7b308007035"
          git diff --check HEAD^

      - name: Publish lint fix
        shell: bash
        run: git push origin HEAD:refs/heads/feat/ton-233-direct-touch-auto-approach
