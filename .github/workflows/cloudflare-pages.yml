name: Deploy Pages

on:
  workflow_run:
    workflows:
      - Verify
    types:
      - completed

permissions:
  contents: read
  deployments: write
  pull-requests: write

concurrency:
  group: cloudflare-pages-${{ github.event.workflow_run.head_branch }}
  cancel-in-progress: true

jobs:
  deploy:
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.head_repository.full_name == github.repository &&
      (
        github.event.workflow_run.event == 'pull_request' ||
        (
          github.event.workflow_run.event == 'push' &&
          github.event.workflow_run.head_branch == 'main'
        )
      )
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Resolve verified ref
        id: ref
        env:
          EVENT_NAME: ${{ github.event.workflow_run.event }}
          HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
          HEAD_BRANCH: ${{ github.event.workflow_run.head_branch }}
          PR_NUMBER: ${{ github.event.workflow_run.pull_requests[0].number }}
        run: |
          if [ "$EVENT_NAME" = "pull_request" ] && [ -n "$PR_NUMBER" ]; then
            echo "checkout_ref=refs/pull/$PR_NUMBER/merge" >> "$GITHUB_OUTPUT"
            echo "deployment_environment=preview" >> "$GITHUB_OUTPUT"
          else
            echo "checkout_ref=$HEAD_SHA" >> "$GITHUB_OUTPUT"
            echo "deployment_environment=production" >> "$GITHUB_OUTPUT"
          fi
          echo "branch=$HEAD_BRANCH" >> "$GITHUB_OUTPUT"
          echo "pr_number=$PR_NUMBER" >> "$GITHUB_OUTPUT"

      - name: Checkout verified ref
        uses: actions/checkout@v6
        with:
          ref: ${{ steps.ref.outputs.checkout_ref }}

      - name: Resolve build identity
        id: identity
        run: |
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          echo "built_at=$(date -u +'%Y-%m-%dT%H:%M:%SZ')" >> "$GITHUB_OUTPUT"

      - name: Check Cloudflare configuration
        id: cloudflare
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [ -n "$CLOUDFLARE_API_TOKEN" ] && [ -n "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "configured=true" >> "$GITHUB_OUTPUT"
          else
            echo "configured=false" >> "$GITHUB_OUTPUT"
            {
              echo "## Cloudflare Pages deployment skipped"
              echo
              echo "Configure repository secrets CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID to enable preview and production deployments."
            } >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Set up Node.js
        if: steps.cloudflare.outputs.configured == 'true'
        uses: actions/setup-node@v6
        with:
          node-version: 22.16.0
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install application dependencies
        if: steps.cloudflare.outputs.configured == 'true'
        run: npm ci --no-audit --no-fund

      - name: Install pinned Wrangler
        if: steps.cloudflare.outputs.configured == 'true'
        run: npm install --no-save --no-audit --no-fund wrangler@4.114.0

      - name: Ensure Pages project exists
        if: steps.cloudflare.outputs.configured == 'true'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          PROJECT_NAME: hh-farm
        run: |
          ./node_modules/.bin/wrangler pages project list --json > /tmp/pages-projects.json
          if ! node -e 'const fs=require("node:fs"); const projects=JSON.parse(fs.readFileSync("/tmp/pages-projects.json","utf8")); process.exit(projects.some((project)=>project.name===process.argv[1])?0:1)' "$PROJECT_NAME"; then
            ./node_modules/.bin/wrangler pages project create "$PROJECT_NAME" --production-branch=main
          fi

      - name: Build verified deployment assets
        if: steps.cloudflare.outputs.configured == 'true'
        env:
          HH_FARM_GIT_SHA: ${{ steps.identity.outputs.sha }}
          HH_FARM_GIT_REF: ${{ steps.ref.outputs.branch }}
          HH_FARM_BUILD_TIME: ${{ steps.identity.outputs.built_at }}
          HH_FARM_DEPLOYMENT_ENVIRONMENT: ${{ steps.ref.outputs.deployment_environment }}
        run: |
          npm run build
          npm run verify:production-bundle

      - name: Deploy to Cloudflare Pages
        if: steps.cloudflare.outputs.configured == 'true'
        id: deploy
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          wranglerVersion: 4.114.0
          command: >-
            pages deploy dist
            --project-name=hh-farm
            --branch=${{ steps.ref.outputs.branch }}
            --commit-hash=${{ steps.identity.outputs.sha }}
            --commit-message="Verified GitHub Actions deployment"
          gitHubToken: ${{ secrets.GITHUB_TOKEN }}

      - name: Smoke test deployed URL
        if: steps.cloudflare.outputs.configured == 'true'
        id: smoke
        env:
          ALIAS_URL: ${{ steps.deploy.outputs.pages-deployment-alias-url }}
          DEPLOYMENT_URL: ${{ steps.deploy.outputs.deployment-url }}
          EXPECTED_SHA: ${{ steps.identity.outputs.sha }}
          EXPECTED_ENVIRONMENT: ${{ steps.ref.outputs.deployment_environment }}
        run: |
          TARGET_URL="$ALIAS_URL"
          if [ -z "$TARGET_URL" ]; then
            TARGET_URL="$DEPLOYMENT_URL"
          fi
          if [ -z "$TARGET_URL" ]; then
            echo "Cloudflare deployment did not return a URL." >&2
            exit 1
          fi
          node scripts/verify-pages-deployment.mjs "$TARGET_URL" "$EXPECTED_SHA" "$EXPECTED_ENVIRONMENT"
          echo "url=$TARGET_URL" >> "$GITHUB_OUTPUT"

      - name: Comment preview URL on pull request
        if: >-
          steps.cloudflare.outputs.configured == 'true' &&
          github.event.workflow_run.event == 'pull_request'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ steps.ref.outputs.pr_number }}
          PREVIEW_URL: ${{ steps.smoke.outputs.url }}
          DEPLOYED_SHA: ${{ steps.identity.outputs.sha }}
        run: |
          gh pr comment "$PR_NUMBER" --body "Cloudflare Pages preview verified: $PREVIEW_URL

          Commit: \`$DEPLOYED_SHA\`"

      - name: Record deployment summary
        if: steps.cloudflare.outputs.configured == 'true'
        env:
          DEPLOYMENT_URL: ${{ steps.smoke.outputs.url }}
          DEPLOYMENT_ENVIRONMENT: ${{ steps.ref.outputs.deployment_environment }}
          DEPLOYED_SHA: ${{ steps.identity.outputs.sha }}
        run: |
          {
            echo "## Cloudflare Pages deployment"
            echo
            echo "- Environment: $DEPLOYMENT_ENVIRONMENT"
            echo "- Commit: \`$DEPLOYED_SHA\`"
            echo "- URL: $DEPLOYMENT_URL"
            echo "- Smoke test: passed"
          } >> "$GITHUB_STEP_SUMMARY"
